spring:
  application:
    name: aa-check-backend
  datasource:
    # 本地默认值；生产用环境变量覆盖
    url: ${DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/aacheck}}
    username: ${DATASOURCE_USERNAME:aacheck}
    password: ${DATASOURCE_PASSWORD:aacheck123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB
  web:
    resources:
      static-locations: classpath:/static/

server:
  # 生产用环境变量 PORT 注入监听端口
  port: ${PORT:8080}
  address: 0.0.0.0

app:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:change-me-in-production-0123456789abcdef0123456789abcdef}
    expire-days: 30
  # 生产指向挂载卷（推荐 /data/uploads）
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 用本地磁盘时为 /images；若改用 R2/Supabase Storage 设成完整 URL
  image-url-prefix: ${IMAGE_URL_PREFIX:/images}

management:
  endpoints:
    web:
      exposure:
        include: health
