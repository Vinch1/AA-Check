# Render Blueprint —— AA-Check 后端
# 用法：在 Render 新建 Blueprint，连到本仓库，Root Directory 设为 backend。
# 也可不用本文件，直接在 Dashboard 建 Web Service + PostgreSQL，按下方 build/start 配置。

databases:
  - name: aa-check-db
    databaseName: aacheck
    user: aacheck
    plan: free
    # 免费 Postgres 会在闲置后自动暂停，首次访问会唤醒（略有延迟）

services:
  - type: web
    name: aa-check-backend
    runtime: java
    javaVersion: 21
    rootDir: .
    plan: free
    # 免费 Web Service 闲置 15 分钟后会休眠，首次请求需唤醒
    buildCommand: "./gradlew bootJar --no-daemon"
    startCommand: "java -jar build/libs/*.jar"
    healthCheckPath: /actuator/health
    envVars:
      # Render 自动把托管 Postgres 的连接串注入 DATABASE_URL（postgres:// 格式）
      - key: DATABASE_URL
        fromDatabase:
          name: aa-check-db
          property: connectionString
      # 自动生成强随机密钥，可在 Dashboard 手动覆盖
      - key: JWT_SECRET
        generateValue: true
      # Render 会自动注入 PORT，application.yml 里 server.port=${PORT:8080} 已适配
      # 上传目录：免费版无持久磁盘，重启/部署后文件会丢失。
      # 需要持久化请升级付费版并挂载 Disk，再把这里改成挂载路径（如 /data/uploads）。
      - key: UPLOAD_DIR
        value: "./uploads"
